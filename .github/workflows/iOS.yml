name: iOS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: List Schemes
        run: xcodebuild -list -project "Ganapathi Bank.xcodeproj"

      - name: Build and Test
        run: |
          xcodebuild \
            test \
            -project "Ganapathi Bank.xcodeproj" \
            -scheme "Ganapathi Bank" \
            -destination 'platform=iOS Simulator,name=iPhone 17'
