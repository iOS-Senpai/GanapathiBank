included:
  - Ganapathi Bank
  - Ganapathi BankTests

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - sorted_imports
  - unused_import

line_length:
  warning: 120
  error: 150

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 250
  error: 350

identifier_name:
  min_length: 2
